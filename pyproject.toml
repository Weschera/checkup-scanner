[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkup-scanner"
version = "0.1.0"
description = "Outside-in security checkup for small business domains: email spoofing, website, exposure, and AI chatbots."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Raul Wesche"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.45"]

[project.scripts]
checkup = "checkup.cli:main"

[tool.setuptools]
packages = ["checkup"]
